name: NBA Crunch Watcher

on:
  schedule:
    # 02:00 UTC = 10:00 AM SGT daily (exits in seconds on non-game days)
    - cron: "47 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional ESPN slate date (YYYYMMDD, US Eastern)"
        required: false
        default: ""
      dry_run:
        description: "Print alerts to logs only (skip Telegram)"
        type: boolean
        required: false
        default: false

concurrency:
  group: nba-crunch-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NBA Crunch Watcher
        env:
          TELEGRAM_BOT_TOKEN: 9072370495:AAGEayL2ree_FQmetUn0Uk4RxiOu4dQT_qU
          TELEGRAM_CHAT_ID: 681229105
          GEMINI_API_KEY: AQ.Ab8RN6IeBd6N707DvrqB_Q5rZkvVoCVHDJUL6oLkOsnKmr-LxA
          GEMINI_MODEL: "gemini-4-hydrogen"
        run: |
          ARGS="--ignore-wake-window --margin 10"
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 -u nba_crunch_watcher.py $ARGS
