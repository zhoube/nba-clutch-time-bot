name: NBA Crunch Watcher

on:
  schedule:
    # Early-slate window: 21:47 UTC = 05:47 AM SGT daily (catches 6:00 AM - 11:00 AM SGT tips)
    - cron: "47 21 * * *"
    # Late-slate handoff: 03:17 UTC = 11:17 AM SGT daily (picks up West Coast tips & OT after early job timeout)
    - cron: "17 3 * * *"
    # Weekend US matinee window: 17:17 UTC Sat/Sun = 01:17 AM SGT Sun/Mon
    - cron: "17 17 * * 6,0"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional ESPN slate date (YYYYMMDD, US Eastern)"
        required: false
        default: ""
      dry_run:
        description: "Print alerts to logs only (skip Telegram)"
        type: boolean
        required: false
        default: false
      test_reddit:
        description: "Dry-run test r/nba Game Thread access only"
        type: boolean
        required: false
        default: false

concurrency:
  group: nba-crunch-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for team-logo banners
        run: pip install --quiet pillow

      - name: Run NBA Crunch Watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-4-hydrogen"
        run: |
          ARGS="--ignore-wake-window --margin 10"
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.test_reddit }}" = "true" ]; then
            ARGS="$ARGS --test-reddit"
          fi
          python3 -u nba_crunch_watcher.py $ARGS
